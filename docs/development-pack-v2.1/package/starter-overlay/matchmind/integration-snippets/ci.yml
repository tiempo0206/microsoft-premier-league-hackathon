name: MatchMind contract checks
on: [pull_request, push]
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matchmind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-contracts.txt
      - run: python tools/check_frozen.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
# Integrator copies this file into repository-root .github/workflows/ after reviewing existing CI.
# Add real backend tests + frontend typecheck/build when those modules are implemented.
